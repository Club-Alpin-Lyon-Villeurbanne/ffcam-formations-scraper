name: Import FFCAM

on:
  schedule:
    - cron: '17 3 * * 1'   # lundi 03:17 UTC (minute non ronde : moins de retard côté GitHub)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Import à blanc (aucune écriture en base)'
        type: boolean
        default: false

permissions:
  contents: read

# Un seul run à la fois : deux runs simultanés avec le même compte FFCAM se volent la session extranet
concurrency:
  group: import-ffcam
  cancel-in-progress: false

jobs:
  import:
    name: Import ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      max-parallel: 1       # un seul scraping à la fois sur l'extranet FFCAM
      matrix:
        environment: [lyon-staging, lyon-prod]   # un environment GitHub par base cible
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Secrets exposés à ce seul step, jamais à l'installation des dépendances ; bash s'arrête si check échoue
      - name: Vérification de la configuration puis import
        run: |
          pnpm run check
          pnpm run ${{ inputs.dry_run && 'import:dry' || 'import' }}
        env:
          NODE_ENV: production
          CLUB: ${{ vars.CLUB }}
          CLUB_CODE: ${{ vars.CLUB_CODE }}
          FFCAM_EMAIL: ${{ secrets.FFCAM_EMAIL }}
          FFCAM_PASSWORD: ${{ secrets.FFCAM_PASSWORD }}
          FFCAM_PROFILE: ${{ vars.FFCAM_PROFILE }}
          MYSQL_ADDON_HOST: ${{ secrets.MYSQL_ADDON_HOST }}
          MYSQL_ADDON_PORT: ${{ secrets.MYSQL_ADDON_PORT }}
          MYSQL_ADDON_USER: ${{ secrets.MYSQL_ADDON_USER }}
          MYSQL_ADDON_PASSWORD: ${{ secrets.MYSQL_ADDON_PASSWORD }}
          MYSQL_ADDON_DB: ${{ secrets.MYSQL_ADDON_DB }}
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapport-${{ matrix.environment }}-${{ github.run_id }}
          path: data/reports/*.json
          if-no-files-found: ignore
          retention-days: 90

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # GitHub désactive les crons après 60 jours sans commit
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/import.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
